site_name: inferctl Docs
site_description: Local documentation browser for inferctl.
site_url: "https://inferctl.dev/docs/"

docs_dir: docs
site_dir: ../inferctl-mkdocs-site

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra:
  homepage: https://inferctl.dev

nav:
  - Home: README.md
  - Project:
      - Repo Overview: repo.md
      - Roadmap: top/roadmap.md
      - Changelog: top/changelog.md
      - Contributing: top/contributing.md
      - Releasing: top/releasing.md
      - Security: top/security.md
      - Landscape: top/landscape.md
      - Comparison: top/comparison.md
  - User Docs:
      - Install: install.md
      - Agent Guide: agent-guide.md
      - Verbs: verbs.md
      - Errors: errors.md
      - Lineage: lineage.md
      - Public Readiness: public-readiness.md
      - Robot Docs Guide: cmd/robot-docs-guide.md
  - Examples:
      - Agent Discovery: examples/agent-discovery.md
      - Agent Drift Debug: examples/agent-drift-debug.md
      - CI Markdown Summary: examples/ci-markdown-summary.md
      - Editor Configs: examples/editor-configs.md
      - Preflight Gate: examples/preflight-gate.md
      - Routing Explainer: examples/routing-explainer.md
      - Status Dashboard: examples/status-dashboard.md
      - Team Requirements: examples/team-requirements.md
  - Verified Runs:
      - Overview: verified-runs/README.md

exclude_docs: |
  img/**

validation:
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: ignore
